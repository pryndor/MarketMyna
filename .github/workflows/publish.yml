# A version tag (git tag v0.2.0 && git push origin v0.2.0) builds the package
# with the frontend inside, checks the installed command starts, publishes it
# to PyPI (trusted publishing: no token stored) and makes the GitHub release.
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }

      - name: Build
        run: |
          pip install build
          python .github/build_package.py

      - name: Install the wheel and start it
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          PATH=/tmp/check/bin:$PATH python .github/smoke_test.py marketmyna

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "MarketMyna ${GITHUB_REF_NAME#v}" \
            --notes "Install: \`pipx install marketmyna\` (or \`pip install marketmyna\`), then run \`marketmyna\`."
