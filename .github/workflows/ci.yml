# Tests, frontend build and a start-up check on Linux, Windows and macOS.
# Each machine is set to a non-UTC zone: the app must still keep UTC times.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Time zone (Linux)
        if: runner.os == 'Linux'
        run: sudo timedatectl set-timezone Asia/Kolkata
      - name: Time zone (macOS)
        if: runner.os == 'macOS'
        run: sudo ln -sf /usr/share/zoneinfo/Asia/Kolkata /etc/localtime
      - name: Time zone (Windows)
        if: runner.os == 'Windows'
        run: tzutil /s "India Standard Time"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt pytest

      - name: Tests
        run: python -m pytest -q

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Start the app and load the page
        run: python .github/smoke_test.py
